{% set name = "llama-cpp-python" %}
{% set version = "0.3.36" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/llama_cpp_python-{{ version }}.tar.gz
  sha256: 832db0699007f1be95a7e41ef12e88926b02ba836461e36a36372db2760c1a2e
  patches:
    # Load libllama/libggml/libmtmd from the conda prefix by absolute path (external llama.cpp)
    - 0001-Adapt-shared-library-relocation.patch

build:
  number: 0
  # Upstream supports 3.8, but starlette-context on the channel (>=0.4) needs Python >=3.9.
  skip: true  # [py<39]
  script:  # [unix]
    - export CMAKE_ARGS="${CMAKE_ARGS} -DLLAMA_BUILD=OFF"  # [unix]
    - export CMAKE_ARGS="${CMAKE_ARGS} -DLLAVA_BUILD=OFF"  # [unix]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation  # [unix]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    # Compilers needed because scikit-build-core runs CMake which requires C/C++ compiler
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make  # [not win]

  host:
    - python
    - scikit-build-core >=0.9.2
    - pip

  run:
    - python
    - typing-extensions >=4.5.0
    - numpy >=1.20.0
    - diskcache >=5.6.1
    - jinja2 >=2.11.3

    # External llama.cpp: pin ONE release. The ctypes bindings mirror llama.h at one commit and
    # ggml/llama.cpp have no stable ABI, so a wider pin can segfault consumers (Sep 2026 incident).
    # 0.3.36 wraps 0c1e57098; llama.cpp 0.6.0 has identical struct layouts and function signatures.
    # Re-verify the headers before moving this pin.
    - llama.cpp >=0.6.0,<0.6.1

    # Server extras, kept in run: so the bundled server works out of the box.
    # Approved deviation: upstream caps starlette-context <0.4, but the channel only has 0.4.0
    # and 0.5.1 (0.4 dropped Python 3.8). The server app is verified on both; see the test below.
    - uvicorn >=0.22.0
    - fastapi >=0.100.0
    - pydantic-settings >=2.0.1
    - sse-starlette >=1.6.1
    - starlette-context >=0.3.6
    - pyyaml >=5.1

test:
  imports:
    - llama_cpp
    - llama_cpp._ggml
    - llama_cpp.mtmd_cpp
    - llama_cpp.server.app
  source_files:
    - vendor/llama.cpp/models/ggml-vocab-llama-spm.gguf
  commands:
    - pip check
    # Verify external llama.cpp shared library loads successfully
    - python -c "from llama_cpp import llama_cpp; print(llama_cpp._lib)"
    # Every native library must come from this environment's prefix by absolute path, never from
    # the working directory or another ambient search location.
    - |-
      python -c "import os, sys; from llama_cpp import llama_cpp as C, mtmd_cpp as M, _ggml as G; root = os.path.normcase(os.path.realpath(sys.prefix)) + os.sep; libs = [C._lib._name, M._libmtmd._name, G.libggml._name]; bad = [n for n in libs if not os.path.normcase(os.path.realpath(n)).startswith(root)]; assert not bad, f'library loaded from outside the prefix: {bad}'; print('libraries:', libs)"
    # ABI drift check (Sep 2026 incident: vocab_only read as 32). ctypes maps any nonzero c_bool
    # byte to True, so check the raw bytes of every bool field in both default-params structs.
    - |-
      python -c "import ctypes; from llama_cpp import llama_cpp as C; bad = [(type(s).__name__, n) for s in (C.llama_model_default_params(), C.llama_context_default_params()) for n, t, *_ in s._fields_ if t is ctypes.c_bool and ctypes.string_at(ctypes.addressof(s) + getattr(type(s), n).offset, 1)[0] > 1]; assert not bad, f'ABI drift with external llama.cpp, non-boolean bytes in {bad}'; print('ABI ok')"
    # llama_backend_init() must load the ggml backend plugins of the external llama.cpp by itself.
    - |-
      python -c "import ctypes; from llama_cpp import llama_cpp as C; from llama_cpp._ggml import libggml as g; g.ggml_backend_dev_count.restype = ctypes.c_size_t; C.llama_backend_init(); n = g.ggml_backend_dev_count(); print('ggml devices:', n); assert n > 0, 'no ggml backend loaded'"
    # Real C-API round trip: load a vocab-only model shipped in the sdist and tokenize/detokenize.
    - |-
      python -c "from llama_cpp import Llama; m = Llama(model_path='vendor/llama.cpp/models/ggml-vocab-llama-spm.gguf', vocab_only=True, verbose=False); t = m.tokenize(b'Hello, world!'); assert len(t) > 1 and m.detokenize(t).strip() == b'Hello, world!', t; print('tokenize ok:', len(t), 'tokens')"
    # Server app with the channel's starlette-context: build it and check upstream's middleware.
    - |-
      python -c "from llama_cpp.server.app import create_app; from llama_cpp.server.settings import ModelSettings, ServerSettings; app = create_app(server_settings=ServerSettings(), model_settings=[ModelSettings(model='vendor/llama.cpp/models/ggml-vocab-llama-spm.gguf', vocab_only=True, verbose=False)]); m = [x.cls.__name__ for x in app.user_middleware]; assert 'RawContextMiddleware' in m, m; print('server app ok:', m)"
  requires:
    - pip

about:
  home: https://github.com/abetlen/llama-cpp-python
  summary: Python bindings for the llama.cpp library
  description: |
    Python bindings for llama.cpp, providing a simple Python interface for
    inference with Large Language Models (LLMs) using the llama.cpp backend.
    Supports CPU and GPU acceleration with external llama.cpp library.
  dev_url: https://github.com/abetlen/llama-cpp-python
  doc_url: https://llama-cpp-python.readthedocs.io
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE.md

extra:
  recipe-maintainers:
    - YYYasin19
    - sodre
