{% set name = "llama-cpp-python" %}
{% set version = "0.3.35" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/llama_cpp_python-{{ version }}.tar.gz
  sha256: 1139dbb54509074b70893fab8554e3b079aa9f4d312058ce4018ef0019e3de12
  patches:
    # Adapt shared library relocation for conda environments (find system llama.cpp)
    - 0001-Adapt-shared-library-relocation.patch
    # Load ggml backends when using external llama.cpp (fixes issue #2069)
    - 0002-Load-ggml-backends-for-external-llama.cpp.patch

build:
  number: 2
  skip: true  # [py<39]
  script:  # [unix]
    - export CMAKE_ARGS="${CMAKE_ARGS} -DLLAMA_BUILD=OFF"  # [unix]
    - export CMAKE_ARGS="${CMAKE_ARGS} -DLLAVA_BUILD=OFF"  # [unix]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation  # [unix]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    # Compilers needed because scikit-build-core runs CMake which requires C/C++ compiler
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make  # [not win]

  host:
    - python
    - scikit-build-core >=0.9.2
    - pip

  run:
    - python
    - typing-extensions >=4.5.0
    - numpy >=1.20.0
    - diskcache >=5.6.1
    - jinja2 >=2.11.3

    # External llama.cpp package — pinned to a single build validated ABI-
    # compatible with these 0.3.35 bindings (vendored b10454, 34 commits behind).
    # The previous two-range pin (also allowing 0.3.0.10760, 306 commits ahead)
    # let the solver pick a llama.cpp whose struct layout no longer matched the
    # bindings, causing `llama_model_default_params().vocab_only == 32` on macOS
    # and segfaults for consumers (Sep 2026 incident, Jim Kitchen / outerbounds).
    # Widen only after a rebuild against the newer llama.cpp SHA.
    - llama.cpp >=0.0.10488,<0.0.10489

    # Server extras (no llama-cpp-python-server split package); kept in run:
    # for feature completeness. starlette-context <0.4 cap intentionally not
    # enforced (server-side, not exercised by our import test).
    - uvicorn >=0.22.0
    - fastapi >=0.100.0
    - pydantic-settings >=2.0.1
    - sse-starlette >=1.6.1
    - starlette-context >=0.3.6
    - pyyaml >=5.1

test:
  imports:
    - llama_cpp
  commands:
    - pip check
    # Verify external llama.cpp shared library loads successfully
    - python -c "from llama_cpp import llama_cpp; print(llama_cpp._lib)"
    # ABI smoke test — dlopen alone doesn't catch struct-layout drift between
    # our vendored ctypes bindings and the external llama.cpp .so. Call a
    # struct-returning C entry point and sanity-check a known-default field.
    # Regression fixture for the Sep 2026 pin-widening incident: the previous
    # build shipped bindings against a llama.cpp whose `llama_model_params`
    # layout differed, so `vocab_only` read as 32 instead of 0/1 and consumers
    # segfaulted. This test catches the same class of ABI drift at CI time.
    - python -c "from llama_cpp import llama_cpp; p = llama_cpp.llama_model_default_params(); assert p.vocab_only in (0, 1, False, True), f'ABI drift with external llama.cpp: vocab_only={p.vocab_only!r}'; print(f'ABI ok: vocab_only={bool(p.vocab_only)}')"
  requires:
    - pip

about:
  home: https://github.com/abetlen/llama-cpp-python
  summary: Python bindings for the llama.cpp library
  description: |
    Python bindings for llama.cpp, providing a simple Python interface for
    inference with Large Language Models (LLMs) using the llama.cpp backend.
    Supports CPU and GPU acceleration with external llama.cpp library.
  dev_url: https://github.com/abetlen/llama-cpp-python
  doc_url: https://llama-cpp-python.readthedocs.io
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE.md

extra:
  recipe-maintainers:
    - YYYasin19
    - sodre
